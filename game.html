<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandante Pug - Space Defender</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #090a0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .top-nav {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }

        .back-btn {
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.4);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            color: #ffffff;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-align: center;
            color: #00d2ff;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.15), rgba(0, 210, 255, 0.15));
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 12px 24px;
            margin-bottom: 20px;
            text-align: center;
            max-width: 800px;
        }

        .hero-title {
            font-size: 1.2rem;
            color: #ffb703;
            font-weight: bold;
            margin-bottom: 6px;
        }

        p.instructions {
            font-size: 0.95rem;
            color: #ccc;
        }

        .controls-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            color: #00ffcc;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 850px;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.25);
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #00d2ff55;
            background: #000;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <!-- Modifica el atributo href="#" con el enlace de tu sitio principal -->
        <a href="index.html" class="back-btn">⬅️ Volver al sitio principal</a>
    </div>

    <h1>🐶 Comandante Pug: Space Defender</h1>

    <div class="hero-banner">
        <div class="hero-title">¡Ayuda al Comandante Pug a destruir los asteroides! ☄️</div>
        <p class="instructions">
            Pilotea la nave espacial: <span class="controls-badge">W A S D</span> para Moverte | 
            <span class="controls-badge">ENTER</span> para Disparar | 
            ¡No dejes que ningún asteroide te destruya!
        </p>
    </div>

    <div class="main-container">
        <div class="game-wrapper" id="mainGameContainer">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>
    </div>

    <script>
        // Sistema de Sonido con Web Audio API
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playLaserSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log(e);
            }
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (e) {
                console.log(e);
            }
        }

        // Función principal del Juego
        function initGame(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let score = 0;
            let gameOver = false;
            let particles = [];
            let bullets = [];
            let meteors = [];
            let lastShot = 0;
            let spawnTimer = 0;

            const keys = {
                w: false, a: false, s: false, d: false,
                Enter: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
            };

            const player = {
                x: canvas.width / 2,
                y: canvas.height - 70,
                width: 44,
                height: 48,
                speed: 6,
                isExploded: false
            };

            const stars = Array.from({ length: 60 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            }));

            function keyDownHandler(e) {
                initAudio();
                const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
                if (keys.hasOwnProperty(key)) keys[key] = true;
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    keys['Enter'] = true;
                }
            }

            function keyUpHandler(e) {
                const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
                if (keys.hasOwnProperty(key)) keys[key] = false;
                if (e.key === 'Enter' || e.key === ' ') keys['Enter'] = false;
            }

            window.addEventListener('keydown', keyDownHandler);
            window.addEventListener('keyup', keyUpHandler);

            function createExplosion(x, y, count = 35, isPlayer = false) {
                playExplosionSound();
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * (isPlayer ? 9 : 5) + 1;
                    particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * (isPlayer ? 5 : 3) + 1,
                        color: isPlayer 
                            ? ['#ff4b2b', '#ffb703', '#f4a261', '#ffffff'][Math.floor(Math.random() * 4)]
                            : ['#ff9f1c', '#e76f51', '#8d99ae'][Math.floor(Math.random() * 3)],
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.015
                    });
                }
            }

            function shoot() {
                const now = Date.now();
                if (now - lastShot > 170) {
                    playLaserSound();
                    bullets.push({
                        x: player.x,
                        y: player.y - player.height / 2,
                        width: 5, height: 16, speed: 11, color: '#00ffff'
                    });
                    lastShot = now;
                }
            }

            function spawnMeteor() {
                const radius = Math.random() * 22 + 15;
                meteors.push({
                    x: Math.random() * (canvas.width - radius * 2) + radius,
                    y: -radius,
                    radius: radius,
                    speed: Math.random() * 2 + 2 + score * 0.04,
                    rotation: 0,
                    rotationSpeed: (Math.random() - 0.5) * 0.06
                });
            }

            function checkCollisionMeteorPlayer(m, ship) {
                const dx = m.x - ship.x;
                const dy = m.y - ship.y;
                return Math.sqrt(dx * dx + dy * dy) < m.radius + (ship.width / 2.2);
            }

            function restartGame() {
                initAudio();
                score = 0;
                gameOver = false;
                player.isExploded = false;
                player.x = canvas.width / 2;
                player.y = canvas.height - 70;
                bullets = []; meteors = []; particles = [];
            }

            canvas.addEventListener('click', () => { if (gameOver) restartGame(); });

            function update() {
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > canvas.height) s.y = 0;
                });

                if (!gameOver) {
                    if ((keys.w || keys.ArrowUp) && player.y - player.height / 2 > 0) player.y -= player.speed;
                    if ((keys.s || keys.ArrowDown) && player.y + player.height / 2 < canvas.height) player.y += player.speed;
                    if ((keys.a || keys.ArrowLeft) && player.x - player.width / 2 > 0) player.x -= player.speed;
                    if ((keys.d || keys.ArrowRight) && player.x + player.width / 2 < canvas.width) player.x += player.speed;

                    if (keys.Enter) shoot();

                    spawnTimer++;
                    if (spawnTimer % Math.max(18, 55 - Math.floor(score / 2)) === 0) spawnMeteor();

                    bullets.forEach((b, index) => {
                        b.y -= b.speed;
                        if (b.y < -10) bullets.splice(index, 1);
                    });

                    meteors.forEach((m, mIndex) => {
                        m.y += m.speed;
                        m.rotation += m.rotationSpeed;

                        if (checkCollisionMeteorPlayer(m, player)) {
                            createExplosion(player.x, player.y, 70, true);
                            createExplosion(m.x, m.y, 30, false);
                            player.isExploded = true;
                            gameOver = true;
                        }

                        bullets.forEach((b, bIndex) => {
                            const dist = Math.sqrt((b.x - m.x) ** 2 + (b.y - m.y) ** 2);
                            if (dist < m.radius) {
                                createExplosion(m.x, m.y, 22, false);
                                meteors.splice(mIndex, 1);
                                bullets.splice(bIndex, 1);
                                score += 10;
                            }
                        });

                        if (m.y - m.radius > canvas.height) meteors.splice(mIndex, 1);
                    });
                }

                particles.forEach((p, index) => {
                    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                    if (p.alpha <= 0) particles.splice(index, 1);
                });
            }

            function drawPlayer(x, y) {
                ctx.save();
                ctx.translate(x, y);

                ctx.fillStyle = Math.random() > 0.5 ? '#ff4b2b' : '#ffb703';
                ctx.beginPath();
                ctx.moveTo(-10, 20);
                ctx.lineTo(0, 20 + (Math.random() * 16 + 10));
                ctx.lineTo(10, 20);
                ctx.fill();

                ctx.fillStyle = '#00d2ff';
                ctx.beginPath();
                ctx.moveTo(0, -25);
                ctx.lineTo(22, 20);
                ctx.lineTo(0, 12);
                ctx.lineTo(-22, 20);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.beginPath();
                ctx.arc(0, -2, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#c68b59';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#3a2312';
                ctx.beginPath();
                ctx.arc(-8, -6, 4, 0, Math.PI * 2);
                ctx.arc(8, -6, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2b1b10';
                ctx.beginPath();
                ctx.ellipse(0, 3, 6, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-4, -1, 3, 0, Math.PI * 2);
                ctx.arc(4, -1, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(-3.5, -1, 1.6, 0, Math.PI * 2);
                ctx.arc(4.5, -1, 1.6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff4d6d';
                ctx.beginPath();
                ctx.arc(0, 5, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                stars.forEach(s => {
                    ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
                ctx.globalAlpha = 1;

                if (!player.isExploded) {
                    drawPlayer(player.x, player.y);
                }

                bullets.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.fillRect(b.x - b.width / 2, b.y, b.width, b.height);
                    ctx.shadowBlur = 0;
                });

                meteors.forEach(m => {
                    ctx.save();
                    ctx.translate(m.x, m.y);
                    ctx.rotate(m.rotation);
                    ctx.fillStyle = '#6c757d';
                    ctx.strokeStyle = '#495057';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, m.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#495057';
                    ctx.beginPath();
                    ctx.arc(-m.radius * 0.3, -m.radius * 0.2, m.radius * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                ctx.fillStyle = '#ffb703';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(`🐶 Comandante Pug | Asteroides Destruidos: ${score / 10}`, 20, 35);

                if (gameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.textAlign = 'center';

                    ctx.fillStyle = '#ff416c';
                    ctx.font = 'bold 36px sans-serif';
                    ctx.fillText('💥 ¡EL COMANDANTE PUG HA CAÍDO! 💥', canvas.width / 2, canvas.height / 2 - 30);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '20px sans-serif';
                    ctx.fillText(`Puntaje Final: ${score} Puntos`, canvas.width / 2, canvas.height / 2 + 15);

                    ctx.fillStyle = '#00d2ff';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText('Haz clic para reiniciar la misión', canvas.width / 2, canvas.height / 2 + 65);
                    ctx.textAlign = 'left';
                }
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }

        initGame('gameCanvas');
    </script>
</body>
</html>
