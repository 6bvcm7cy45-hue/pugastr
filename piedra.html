<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera - Matchmaking & Animaciones</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 12px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .wallet-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
            word-break: break-all;
        }

        /* ESTILOS DE EMPAREJAMIENTO (RADAR ANIMADO) */
        .matchmaking-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .radar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            width: 120px;
            position: relative;
            margin-bottom: 20px;
        }

        .radar-pulse {
            width: 60px;
            height: 60px;
            background-color: rgba(59, 130, 246, 0.4);
            border-radius: 50%;
            position: absolute;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .radar-center {
            width: 30px;
            height: 30px;
            background-color: var(--primary);
            border-radius: 50%;
            z-index: 2;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(2.2); opacity: 0.2; }
            100% { transform: scale(3.0); opacity: 0; }
        }

        /* ANIMACIÓN DE TRANSICIÓN VS AL INICIAR */
        .game-arena {
            display: none;
            animation: slideInFromSides 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes slideInFromSides {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .choices-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .choice-btn {
            background: #334155;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: floatEffect 3s ease-in-out infinite;
        }

        .choice-btn:nth-child(2) { animation-delay: 0.5s; }
        .choice-btn:nth-child(3) { animation-delay: 1s; }

        .choice-btn:hover {
            border-color: var(--primary);
            background: #1e293b;
            transform: translateY(-5px);
        }

        @keyframes floatEffect {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .status-text {
            text-align: center;
            font-weight: 600;
            margin: 15px 0;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Batalla Web3: Piedra, Papel o Tijera</h1>
        <div id="walletDisplay" class="wallet-info">Billetera no conectada</div>

        <div id="lobbySection">
            <button class="btn" onclick="conectarBilletera()">Conectar Billetera</button>
            <button class="btn" onclick="crearSala()">Crear Sala de Partida</button>
            <div style="margin: 15px 0; display: flex; gap: 10px;">
                <input type="text" id="inputRoomId" placeholder="Ingresa el ID de la Sala" style="flex:1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background:#0f172a; color:white;">
                <button class="btn" style="width: auto; margin:0;" onclick="unirseSalaManual()">Unirse</button>
            </div>
        </div>

        <!-- SECCIÓN DE EMPAREJAMIENTO (RADAR) -->
        <div id="matchmakingSection" class="matchmaking-box">
            <div class="radar-container">
                <div class="radar-pulse"></div>
                <div class="radar-center"></div>
            </div>
            <p id="matchmakingStatus">Sincronizando billeteras y buscando rival en la sala...</p>
            <button class="btn" style="background-color: #ef4444; margin-top: 15px;" onclick="cancelarBusqueda()">Cancelar</button>
        </div>

        <!-- SECCIÓN DE JUEGO / ARENA -->
        <div id="gameArenaSection" class="game-arena">
            <div class="status-text" id="gameStatus">¡Partida Sincronizada con Éxito! Elige tu jugada:</div>
            <div class="choices-grid">
                <button class="choice-btn" onclick="seleccionarJugada('Piedra')">✊</button>
                <button class="choice-btn" onclick="seleccionarJugada('Papel')">📄</button>
                <button class="choice-btn" onclick="seleccionarJugada('Tijera')">✂️</button>
            </div>
        </div>
    </div>

    <script>
        let cuentaActual = null;
        let salaActualId = null;

        async function conectarBilletera() {
            if (window.ethereum) {
                try {
                    const cuentas = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    cuentaActual = cuentas[0];
                    document.getElementById('walletDisplay').innerText = `Conectado: ${cuentaActual}`;
                } catch (error) {
                    console.error("Usuario rechazó la conexión", error);
                }
            } else {
                alert("Por favor, instala MetaMask u otra billetera compatible.");
            }
        }

        function crearSala() {
            if (!cuentaActual) {
                alert("Primero debes conectar tu billetera.");
                return;
            }
            // Generar ID único para la sala basado en timestamp y la billetera del creador
            salaActualId = 'sala_' + Math.random().toString(36).substring(2, 7);
            
            // Simular guardado de sala en backend o contrato inteligente
            localStorage.setItem(salaActualId, JSON.stringify({
                creador: cuentaActual,
                estado: 'esperando',
                oponente: null
            }));

            mostrarMatchmaking(`Sala creada (${salaActualId}). Esperando segunda billetera...`);
            simularEsperaEmparejamiento();
        }

        function unirseSalaManual() {
            if (!cuentaActual) {
                alert("Primero debes conectar tu billetera.");
                return;
            }
            const roomIdInput = document.getElementById('inputRoomId').value.trim();
            if (!roomIdInput) {
                alert("Ingresa un ID de sala válido.");
                return;
            }

            const datosSalaStr = localStorage.getItem(roomIdInput);
            if (!datosSalaStr) {
                alert("La sala no existe o el ID es incorrecto.");
                return;
            }

            let datosSala = JSON.parse(datosSalaStr);
            if (datosSala.creador === cuentaActual) {
                alert("No puedes unirte a tu propia sala con la misma billetera.");
                return;
            }

            // Sincronizar ambas billeteras en la misma sala
            datosSala.oponente = cuentaActual;
            datosSala.estado = 'en_curso';
            localStorage.setItem(roomIdInput, JSON.stringify(datosSala));

            salaActualId = roomIdInput;
            iniciarPartidaVisual();
        }

        function mostrarMatchmaking(mensaje) {
            document.getElementById('lobbySection').style.display = 'none';
            document.getElementById('matchmakingSection').style.display = 'flex';
            document.getElementById('matchmakingStatus').innerText = mensaje;
        }

        function cancelarBusqueda() {
            document.getElementById('matchmakingSection').style.display = 'none';
            document.getElementById('lobbySection').style.display = 'block';
            salaActualId = null;
        }

        // Simulador de sondeo (polling) para verificar cuando la segunda billetera se une a la sala
        function simularEsperaEmparejamiento() {
            const intervalo = setInterval(() => {
                if (!salaActualId) {
                    clearInterval(intervalo);
                    return;
                }
                const datosSala = JSON.parse(localStorage.getItem(salaActualId));
                if (datosSala && datosSala.estado === 'en_curso' && datosSala.oponente) {
                    clearInterval(intervalo);
                    iniciarPartidaVisual();
                }
            }, 1500);
        }

        function iniciarPartidaVisual() {
            document.getElementById('matchmakingSection').style.display = 'none';
            document.getElementById('lobbySection').style.display = 'none';
            document.getElementById('gameArenaSection').style.display = 'block';
        }

        function seleccionarJugada(jugada) {
            alert(`¡Jugada registrada: ${jugada}! Esperando resolución del contrato inteligente para la sala ${salaActualId}.`);
            // Aquí puedes integrar la transacción con Ethers.js / Web3 hacia tu Smart Contract
        }
    </script>
</body>
</html>
